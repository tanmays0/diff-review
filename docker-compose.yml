services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: diffreview
      POSTGRES_PASSWORD: diffreview
      POSTGRES_DB: diffreview
    volumes:
      - diffreview_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffreview -d diffreview"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  diffreview_pg:
