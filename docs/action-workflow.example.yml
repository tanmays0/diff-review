# Copy this file to: .github/workflows/diff-review.yml
#
# Same repo (tanmays0/diff-review): keep `uses: ./action` (requires checkout).
# External consumer repo: change to `uses: tanmays0/diff-review/action@main`
#
# Required Actions secrets (repo → Settings → Secrets and variables → Actions):
#   DIFF_REVIEW_API_URL      = https://diff-review-ten.vercel.app/api/ingest
#   DIFF_REVIEW_INGEST_SECRET = same value as Vercel env DIFF_REVIEW_INGEST_SECRET
#   GROQ_API_KEY              = from https://console.groq.com/keys
name: diff-review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.DIFF_REVIEW_API_URL }}
          ingest-secret: ${{ secrets.DIFF_REVIEW_INGEST_SECRET }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
