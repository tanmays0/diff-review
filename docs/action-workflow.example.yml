# Example workflow — copy to .github/workflows/diff-review.yml in a target repo.
# Uses local composite path when developing inside this monorepo; published install:
#   uses: tanmays0/diff-review/action@main
name: diff-review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.DIFF_REVIEW_API_URL }}
          ingest-secret: ${{ secrets.DIFF_REVIEW_INGEST_SECRET }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
